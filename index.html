<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samaji — School Management Platform</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .stack{width:100%;max-width:440px;}
  .pick{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E8EAED;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:18px;text-decoration:none;color:inherit;margin-top:12px;}
  .pick:hover{border-color:#C7CBFF;}
  .pick .tile{flex:none;width:44px;height:44px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;}
  .arrow{margin-left:auto;color:#CDD2DA;}
</style>
</head>
<body>
  <div class="hero"><div class="stack">
    <div class="brand" style="justify-content:center;margin-bottom:6px;"><div class="logo indigo"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M5 18L4 7l4.5 5L12 4l3.5 8L20 7l-1 11H5z"/><rect x="5" y="19.2" width="14" height="2.1" rx="1.05"/></svg></div><strong style="font-size:16px;">Samaji</strong></div>
    <p class="muted" style="text-align:center;font-size:13.5px;margin:0 0 18px;">Choose your portal.</p>

    <a class="pick" href="admin/">
      <span class="tile" style="background:#4F46E5;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M5 18L4 7l4.5 5L12 4l3.5 8L20 7l-1 11H5z"/><rect x="5" y="19.2" width="14" height="2.1" rx="1.05"/></svg></span>
      <div><div style="font-size:15px;font-weight:700;">Admin console</div><div class="muted" style="font-size:12.5px;margin-top:2px;">Providers — manage schools, packages &amp; flags</div></div>
      <span class="arrow">→</span>
    </a>

    <a class="pick" href="school/">
      <span class="tile" style="background:#0E9384;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:block"><path d="M5 18L4 7l4.5 5L12 4l3.5 8L20 7l-1 11H5z"/><rect x="5" y="19.2" width="14" height="2.1" rx="1.05"/></svg></span>
      <div><div style="font-size:15px;font-weight:700;">School portal</div><div class="muted" style="font-size:12.5px;margin-top:2px;">Schools — your license-gated workspace</div></div>
      <span class="arrow">→</span>
    </a>

    <p class="hint" style="text-align:center;">Powered by Pillartech Solutions</p>
  </div></div>
</body>
</html>
