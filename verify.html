<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Report Card — Samaji</title>
<meta name="robots" content="noindex">
<style>
  /* Self-hosted (assets/fonts/) — see the note in assets/styles.css.
     This page doesn't load styles.css (self-contained public page),
     so it needs its own copy of the same @font-face declarations. */
  @font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url('assets/fonts/IBMPlexSans-Variable.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/IBMPlexMono-500.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  :root{--teal:#0E9384;--teal-d:#0B6E63;--ink:#0E1424;--ink2:#475467;--muted:#7A8499;--line:#E9ECF1;--bg:#F6F8FA;--red:#C2410C;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .card{max-width:440px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 8px 30px rgba(14,20,36,.06);}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;margin-bottom:22px;}
  .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#12B3A1,#0B6E63);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
  h1{font-size:17px;font-weight:700;margin-bottom:4px;}
  p.sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .state{text-align:center;padding:30px 0;color:var(--muted);font-size:13.5px;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 12px;text-transform:uppercase;letter-spacing:.02em;}
  .badge.ok{background:#E6F6F3;color:var(--teal-d);}
  .badge.no{background:#FEEBE2;color:var(--red);}
  table.res{width:100%;border-collapse:collapse;margin-top:18px;font-size:13.5px;}
  table.res td{padding:8px 2px;border-bottom:1px solid var(--line);}
  table.res td.k{color:var(--muted);width:120px;}
  table.res td.v{font-weight:600;text-align:right;}
  .code-in{display:flex;gap:8px;margin-top:4px;}
  .code-in input{flex:1;font-family:'IBM Plex Mono',monospace;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;outline:none;}
  .code-in input:focus{border-color:var(--teal);}
  .code-in button{border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;background:linear-gradient(135deg,#12B3A1,#0B7A6E);color:#fff;}
  .foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="mark">S</div>Samaji</div>
  <h1>Report Card Verification</h1>
  <p class="sub">Confirms a Samaji-issued report card is genuine, using the code printed on it.</p>
  <div class="code-in">
    <input id="code-input" class="mono" placeholder="e.g. AB12CD34EF" maxlength="20">
    <button id="code-go">Verify</button>
  </div>
  <div id="result"></div>
  <div class="foot">Samaji School System</div>
</div>
<script src="assets/config.js"></script>
<script src="assets/vendor/supabase-js-2.112.2.min.js"></script>
<script>
(function(){
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  var cfg = window.SAMAJI_CONFIG||{};
  var sb = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  var resultEl = document.getElementById("result");
  var input = document.getElementById("code-input");

  function fmtDate(d){ if(!d) return "—"; var dt=new Date(d); if(isNaN(dt.getTime())) return "—";
    return dt.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}); }

  async function verify(code){
    code = (code||"").trim().toUpperCase();
    if (!code){ resultEl.innerHTML = '<div class="state">Enter the code printed under the QR code on the report card.</div>'; return; }
    if (!sb){ resultEl.innerHTML = '<div class="state">Verification service is not configured.</div>'; return; }
    resultEl.innerHTML = '<div class="state">Checking…</div>';
    var r = await sb.rpc("verify_report_card", { p_code: code });
    if (r.error){ resultEl.innerHTML = '<div class="state">Something went wrong. Try again.</div>'; return; }
    var row = (r.data||[])[0];
    if (!row){
      resultEl.innerHTML = '<div style="text-align:center;margin-top:18px;"><span class="badge no">Not found</span>'
        + '<p class="sub" style="margin-top:10px;">No report card matches this code. Check it was typed correctly.</p></div>';
      return;
    }
    resultEl.innerHTML = '<div style="text-align:center;margin-top:18px;"><span class="badge ok">&#10003; Genuine report card</span></div>'
      + '<table class="res"><tbody>'
      + '<tr><td class="k">Learner</td><td class="v">'+esc(row.student_name)+'</td></tr>'
      + '<tr><td class="k">Class</td><td class="v">'+esc(row.class_label||"—")+'</td></tr>'
      + '<tr><td class="k">Term</td><td class="v">'+esc(row.term_name||"—")+' · '+esc(row.academic_year||"—")+'</td></tr>'
      + '<tr><td class="k">School</td><td class="v">'+esc(row.school_name||"—")+'</td></tr>'
      + '<tr><td class="k">Overall</td><td class="v">'+(row.overall_average!=null?esc(row.overall_average)+"%":"—")+'</td></tr>'
      + '<tr><td class="k">Promotion status</td><td class="v">'+esc(row.promotion_status||"—")+'</td></tr>'
      + '<tr><td class="k">Issued</td><td class="v">'+fmtDate(row.published_at)+'</td></tr>'
      + '</tbody></table>';
  }

  document.getElementById("code-go").onclick = function(){ verify(input.value); };
  input.addEventListener("keydown", function(e){ if (e.key==="Enter") verify(input.value); });

  var qsCode = new URLSearchParams(window.location.search).get("code");
  if (qsCode){ input.value = qsCode.toUpperCase(); verify(qsCode); }
  else { resultEl.innerHTML = '<div class="state">Enter the code printed under the QR code on the report card.</div>'; }
})();
</script>
</body>
</html>
