<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify Receipt — Samaji</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="../assets/icons/favicon.ico">
<meta name="theme-color" content="#0E9384">
<meta name="robots" content="noindex">
<script defer src="../assets/vendor/supabase.min.js"></script>
<script defer src="../assets/config.js"></script>
<script defer src="../assets/app.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0E9384 0%,#0B6E63 55%,#0A4F49 100%);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;}
  .card{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:#0E9384;display:flex;align-items:center;justify-content:center;}
  .brand strong{font-size:16px;color:#101626;}
  .icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .icon.ok{background:#E7F6F3;color:#0E9384;}
  .icon.bad{background:#FEF3F2;color:#B42318;}
  .icon.wait{background:#F4F6F8;color:#475467;}
  h1{font-size:19px;margin:0 0 6px;text-align:center;color:#101626;}
  p.sub{font-size:13.5px;color:#667085;text-align:center;margin:0 0 20px;}
  .details{border-top:1px solid #EAECEF;padding-top:16px;margin-top:6px;}
  .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;}
  .row .k{color:#667085;}
  .row .v{font-weight:600;color:#101626;text-align:right;}
  .foot{text-align:center;font-size:11.5px;color:#98A2B3;margin-top:22px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M5 18L4 7l4.5 5L12 4l3.5 8L20 7l-1 11H5z"/><rect x="5" y="19.2" width="14" height="2.1" rx="1.05"/></svg></div>
      <strong>Samaji</strong>
    </div>
    <div id="content">
      <div class="icon wait"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h1>Checking receipt…</h1>
      <p class="sub">One moment.</p>
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  var $ = document.getElementById.bind(document);
  var content = $("content");

  function money(n){ return "KES " + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

  function showNoParam(){
    content.innerHTML =
      '<div class="icon wait"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.7"/><path d="M14 14h3v3h-3zM19 14h2M19 19h2M14 19h2M17 17h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>'
      + '<h1>Verify a Samaji receipt</h1>'
      + '<p class="sub">Scan the QR code printed on any Samaji fee receipt to confirm it\u2019s genuine.</p>';
  }

  function showValid(d){
    content.innerHTML =
      '<div class="icon ok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
      + '<h1>This receipt is valid</h1>'
      + '<p class="sub">Issued by ' + esc(d.school_name) + '</p>'
      + '<div class="details">'
      + '<div class="row"><span class="k">Receipt No</span><span class="v">' + esc(d.receipt_no) + '</span></div>'
      + '<div class="row"><span class="k">Student</span><span class="v">' + esc(d.student_name) + '</span></div>'
      + '<div class="row"><span class="k">Amount Paid</span><span class="v">' + money(d.amount) + '</span></div>'
      + '<div class="row"><span class="k">Date</span><span class="v">' + esc(new Date(d.paid_at).toLocaleDateString()) + '</span></div>'
      + (d.term ? '<div class="row"><span class="k">Term</span><span class="v">' + esc(d.term + (d.year ? " " + d.year : "")) + '</span></div>' : '')
      + '<div class="row"><span class="k">Method</span><span class="v">' + esc(d.method) + '</span></div>'
      + '</div>';
  }

  function showInvalid(){
    content.innerHTML =
      '<div class="icon bad"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></div>'
      + '<h1>Could not verify this receipt</h1>'
      + '<p class="sub">This receipt code doesn\u2019t match any record on file. If you believe this is an error, contact the issuing school directly.</p>';
  }

  var params = new URLSearchParams(window.location.search);
  var receiptId = params.get("r");
  if (!receiptId) { showNoParam(); return; }

  var sb = window.getSB && window.getSB();
  if (!sb) { showInvalid(); return; }

  sb.rpc("verify_receipt", { p_id: receiptId }).then(function(res){
    if (res.error || !res.data || res.data.valid !== true) { showInvalid(); return; }
    showValid(res.data);
  }).catch(function(){ showInvalid(); });
});
</script>
</body>
</html>
